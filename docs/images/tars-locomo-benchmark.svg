<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 474" width="960" height="474"><rect width="960" height="474" fill="#0d1117"/><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#1f6feb"/><stop offset="1" stop-color="#58a6ff"/></linearGradient></defs><text x="26" y="32" fill="#e6edf3" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="20" font-weight="700">LOCOMO benchmark</text><text x="26" y="54" fill="#8b949e" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="12.5">1,986 questions over 10 multi-session conversations. Fully local: qwen2.5:14b answers, qwen2.5:32b judges.</text><rect x="18" y="76" width="924" height="368" rx="11" fill="#161b22" stroke="#30363d"/><text x="44" y="102" fill="#8b949e" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="10.5" letter-spacing="1.4">METRIC</text><text x="916" y="102" fill="#8b949e" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="10.5" letter-spacing="1.4" text-anchor="end">BEFORE → AFTER</text><line x1="34" y1="110" x2="926" y2="110" stroke="#21262d"/><text x="44" y="141.0" fill="#e6edf3" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="14">Temporal questions</text><rect x="290" y="132.0" width="330" height="8" rx="4" fill="#21262d"/><rect x="290" y="132.0" width="89.4" height="8" rx="4" fill="url(#g)"/><rect x="303.2" y="128.0" width="2" height="16" rx="1" fill="#8b949e"/><text x="810" y="141.0" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" text-anchor="end">4.0 → </text><text x="868" y="141.0" fill="#58a6ff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="700" text-anchor="end">27.1%</text><text x="916" y="141.0" fill="#3fb950" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" text-anchor="end">+23.1</text><line x1="34" y1="162" x2="926" y2="162" stroke="#21262d"/><text x="