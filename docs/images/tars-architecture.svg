<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 512" width="960" height="512"><rect width="960" height="512" fill="#0d1117"/><text x="26" y="32" fill="#e6edf3" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="20" font-weight="700">How a query becomes an answer</text><text x="26" y="54" fill="#8b949e" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="12.5">Verbatim on write, intelligence on read.</text><rect x="18" y="76" width="924" height="406" rx="11" fill="#161b22" stroke="#30363d"/><text x="44" y="110" fill="#6e7681" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" letter-spacing="1.6">WRITE PATH</text><rect x="44" y="122" width="282" height="92" rx="9" fill="#0d1117" stroke="#30363d"/><text x="59" y="147" fill="#e6edf3" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="13.5" font-weight="700">Ingest</text><text x="59" y="166" fill="#8b949e" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="11.5">Conversations, docs and messages stored</text><text x="59" y="182" fill="#8b949e" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="11.5">verbatim and timestamped, never</text><text x="59" y="198" fill="#8b949e" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="11.5">LLM-summarized at write time.</text><rect x="339" y="122" width="282" height="92" rx="9" fill="#0d1117" stroke="#30363d"/><text x="354" y="147" fill="#e6edf3" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="13.5" font-weight="700">Graph in Postgres</text><text x="354" y="166" fill="#8b949e" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="11.5">Entities, dated observations (validFrom +</text><text x="354" y="182" fill="#8b949e" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="11.5">confidence), directed relations. pgvector</text><text x="354" y="198" fill="#8b949e" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="11.5">in the same database.</text><rect x="634" y="122" width="282" height="76" rx="9" fill="#0d1117" stroke="#30363d"/><text x="649" y="147" fill="#e6edf3" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="13.5" font-weight="700">Dream, nightly</text><text x="649" y="166" fill="#8b949e" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="11.5">Consolidate, integrate, prune. Supersedes</text><text x="649" y="182" fill="#8b949e" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="11.5">contradictions instead of deleting them.</text><text x="480.0" y="230" fill="#6e7681" font-size="15" text-anchor="middle">↓</text><text x="44" y="260" fill="#6e7681" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" letter-spacing="1.6">READ PATH</text><rect x="44" y="272" width="282" height="60" rx="9" fill="#0d1117" stroke="#30363d"/><text x="59" y="297" fill="#e6edf3" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="13.5" font-weight="700">Keyword</text><text x="59" y="316" fill="#8b949e" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="11.5">Exact names, aliases, rare tokens.</text><rect x="339" y="272" width="282" height="60" rx="9" fill="#0d1117" stroke="#30363d"/><text x="354" y="297" fill="#e6edf3" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="13.5" font-weight="700">Vector</text><text x="354" y="316" fill="#8b949e" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="11.5">Local embeddings for paraphrase.</text><rect x="634" y="272" width="282" height="60" rx="9" fill="#0d1117" stroke="#30363d"/><text x="649" y="297" fill="#e6edf3" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="13.5" font-weight="700">Graph</text><text x="649" y="316" fill="#8b949e" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="11.5">Gated expansion over relations.</text><text x="480.0" y="348" fill="#6e7681" font-size="15" text-anchor="middle">↓</text><rect x="44" y="368" width="282" height="92" rx="9" fill="rgba(31,111,235,0.08)" stroke="#1f6feb"/><text x="59" y="393" fill="#58a6ff" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="13.5" font-weight="700">Weighted RRF</text><text x="59" y="412" fill="#8b949e" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="11.5">Fuses the three ranked lists so an exact</text><text x="59" y="428" fill="#8b949e" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="11.5">name match isn’t drowned by semantic</text><text x="59" y="444" fill="#8b949e" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="11.5">noise.</text><rect x="339" y="368" width="282" height="60" rx="9" fill="#0d1117" stroke="#30363d"/><text x="354" y="393" fill="#e6edf3" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="13.5" font-weight="700">LLM rerank (opt-in)</text><text x="354" y="412" fill="#8b949e" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="11.5">Local model reorders the shortlist.</text><rect x="634" y="368" width="282" height="76" rx="9" fill="rgba(31,111,235,0.08)" stroke="#1f6feb"/><text x="649" y="393" fill="#58a6ff" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="13.5" font-weight="700">Compact facts → MCP</text><text x="649" y="412" fill="#8b949e" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="11.5">Dated one-liners and relations. Claude</text><text x="649" y="428" fill="#8b949e" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="11.5">Code, Desktop and phone hit one brain.</text></svg>